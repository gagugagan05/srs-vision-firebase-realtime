/* SRS Vision UI fixes v3 */
.sidebar{
  height:100vh;
  max-height:100vh;
  overflow-y:auto;
  overflow-x:hidden;
  align-self:start;
  scrollbar-gutter:stable;
  padding-bottom:18px;
}
.sidebar::-webkit-scrollbar{width:7px}
.sidebar::-webkit-scrollbar-track{background:transparent}
.sidebar::-webkit-scrollbar-thumb{background:#1d4e7e;border-radius:999px}
.sideBottom{
  position:static;
  left:auto;
  right:auto;
  bottom:auto;
  margin:14px 0 2px;
  padding-top:12px;
  border-top:1px solid rgba(55,110,164,.22);
}
.mainwrap{min-height:100vh;min-width:0}
.content{min-height:calc(100vh - 70px)}
.heroImage{min-height:178px;height:178px;background-color:#081a30;background-position:center;background-size:cover}
.heroImage:after{background:linear-gradient(90deg,rgba(2,9,20,.78) 0%,rgba(2,9,20,.48) 48%,rgba(2,9,20,.32) 100%)}
.heroOverlay{height:100%;display:flex;flex-direction:column;justify-content:center}
.heroOverlay h2{font-size:32px;text-shadow:0 2px 16px rgba(0,0,0,.42)}
.heroOverlay h2 span:last-child{color:#18d7ff}
.pageHead{min-height:58px}
.graphBox{min-height:260px}
.barChart{min-height:210px}

  .sidebar{display:none}
  .content{min-height:calc(100vh - 70px);padding-bottom:88px}
  .heroImage{min-height:170px;height:170px}
  .heroOverlay h2{font-size:25px}
}

  function waNumber(v){const s=String(v||'').trim();if(!s)return '';if(/^https?:\/\//i.test(s))return s;const d=s.replace(/\D/g,'');if(!d)return '';return d.length===10?'91'+d:d}

  function renderProjects(){const rows=state.projects.map((p,i)=>`<div class="trow"><div><b>${esc(p.name)}</b><div class="projectSub">${esc(p.client)}</div></div><div>${esc(p.member)}</div><div>${esc(p.status)}</div><div><div class="bar"><i style="width:${Math.max(0,Math.min(100,p.progress))}%"></i></div><div class="projectSub">${p.progress}% · ${esc(p.tool)}</div></div><div class="heroActions"><button class="btn small" data-edit-project="${i}">Edit</button><button class="btn small cyan" data-assign-project="${i}">Assign</button><button class="btn small" data-share-project="${i}">Share</button><button class="btn small green" data-continue-project="${i}">Continue</button></div></div>`).join('');$('#content').innerHTML=header('Projects','Projects are stored locally immediately and synced to Firebase when available.','<button class="btn primary" data-add-project>＋ New Project</button>')+`<section class="panel"><div class="panelBody"><div class="table"><div class="trow thead"><div>Project</div><div>Assigned Member</div><div>Status</div><div>Progress / Tool</div><div>Actions</div></div>${rows||'<div class="empty">No projects.</div>'}</div></div></section><section class="panel" style="margin-top:12px"><div class="panelHead"><h3>Saved project files & progress</h3><span class="autosave">Every change is auto-saved</span></div><div class="panelBody"><div class="meta"><span class="chip">${state.files.length} saved files</span><span class="chip">${state.assignments.length} assignments</span><span class="chip">${state.tasks.length} work items</span></div></div></section>`}

  function assignmentDispatch(p,member,task){const msg=`SRS Vision Project Assignment\n\nProject: ${p.name}\nClient: ${p.client||'—'}\nAssigned Member: ${p.member}\nTool: ${TOOLS[p.tool]?.[1]||p.tool}\nPrompt: ${p.prompt||task?.prompt||'Start the assigned work.'}\n\nOpen SRS Vision → Work Queue to continue the saved project.`;const wa=waNumber(member?.whatsapp||member?.phone),mail=member?.email||'';openModal('Assignment Created',`<div class="assignBox"><b>${esc(p.name)}</b> assigned to <b>${esc(p.member)}</b>.</div><div class="notificationPreview"><b>Website notification created automatically</b><p>${esc(p.name)} → ${esc(p.member)} · ${esc(TOOLS[p.tool]?.[1]||p.tool)}</p></div><div class="heroActions"><button class="btn green" id="dispatchWa" ${wa?'':'disabled'}>💬 WhatsApp</button><button class="btn primary" id="dispatchMail" ${mail?'':'disabled'}>✉ Email</button><button class="btn" id="dispatchClose">Done</button></div><div class="autosave">The assignment is already saved in Work Queue and Notifications. WhatsApp and email open a pre-filled message for the assigned member.</div>`,()=>{closeModal();notify('Assignment saved successfully')});$('#dispatchWa')?.addEventListener('click',()=>window.open(waHref(wa,msg),'_blank','noopener'));$('#dispatchMail')?.addEventListener('click',()=>{location.href=`mailto:${encodeURIComponent(mail)}?subject=${encodeURIComponent('SRS Vision Project Assignment: '+p.name)}&body=${encodeURIComponent(msg)}`});$('#dispatchClose')?.addEventListener('click',closeModal)}

  function renderReports(){state=normalizeState(state);const p=state.projects,completed=p.filter(x=>x.status==='Completed').length,active=p.length-completed,income=state.finance.transactions.filter(x=>x.kind==='income').reduce((s,x)=>s+Number(x.amount||0),0),expense=state.finance.transactions.filter(x=>x.kind==='expense').reduce((s,x)=>s+Number(x.amount||0),0),profit=income-expense,values=[32,49,44,65,58,78,86];const bars=values.map((v,i)=>`<div class="vcol"><i style="height:${v}%"></i><small>${['Apr','May','Jun','Jul','Aug','Sep','Oct'][i]}</small></div>`).join('');$('#content').innerHTML=header('Reports','Graphical work and financial reporting with separate profit/loss views.','<button class="btn primary" data-export-report>Export Report</button>')+`<div class="kpis"><div class="kpi"><span>Total Project Value</span><b>${money(p.reduce((s,x)=>s+Number(x.value||0),0))}</b><span class="trend">${p.length} projects</span></div><div class="kpi"><span>Income</span><b>${money(income)}</b><span class="trend">Revenue</span></div><div class="kpi"><span>Expenses</span><b>${money(expense)}</b><span class="hint">Tracked</span></div><div class="kpi"><span>Profit / Loss</span><b class="${profit>=0?'pos':'neg'}">${money(profit)}</b><span class="trend">${profit>=0?'Profit':'Loss'}</span></div></div><div class="graphGrid"><section class="graphBox"><h3>Work Performance</h3><div class="barChart">${bars}</div></section><section class="graphBox"><h3>Profit & Loss</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><div class="projectSub">Income</div><div class="profitValue pos">${money(income)}</div></div><div><div class="projectSub">Expenses</div><div class="profitValue neg">${money(expense)}</div></div></div><div class="assignBox"><b>Net: </b><span class="${profit>=0?'pos':'neg'}">${money(profit)}</span><br><small class="projectSub">Add income/expense entries from Accounts or Banking.</small></div></section></div><section class="panel" style="margin-top:12px"><di mber,memberEmail:mem?.email||'',memberWhatsapp:mem?.whatsapp||mem?.phone||'',tool,prompt,time:now};if(old)Object.assign(old,asg);else state.assignments.unshift(asg);state.notifications.unshift({id:Date.now()+2,title:'New work assigned',body:`${p.name} → ${member} using ${TOOLS[tool]?.[1]||tool}`,member,email:mem?.email||'',whatsapp:mem?.whatsapp||mem?.phone||'',time:now,read:false});persist();closeModal();renderWork();notify(`Assigned to ${member}; notification created`);setTimeout(()=>assignmentDispatch(p,mem,task),50)})}

  function bindTool(key){
    $$('.autosaveInput').forEach(el=>el.addEventListener('input',()=>{saveWorkspace(key,{title:$('#wkTitle')?.value||state.workspaces[key]?.title||'',body:$('#wkBody')?.value||''});const s=$('#wsSave');if(s)s.textContent='✓ Saved just now'}));

    }

  function musicEditor(){const p=state.music.playlist;return `<div class="musicGrid"><div class="cover"><div class="record"></div></div><div class="player"><div class="field"><label>Add local audio</label><input class="input" id="musicFile" type="file" accept="audio/*" multiple></div><div class="trackName" id="trackName">${p[0]?esc(p[0].name):'SRS Vision Music Player'}</div><div class="trackArtist">Local playlist · external services below</div><input class="range" id="musicRange" type="range" min="0" max="100" value="0"><div class="playerBtns"><button class="circleBtn" id="musicPrev">◀</button><button class="circleBtn play" id="musicPlay">▶</button><button class="circleBtn" id="musicNext">▶</button></div><div class="playlist">${p.map((x,i)=>`<div class="song"><div><b>${esc(x.name)}</b><small>Local track</small></div><button class="btn small danger" data-music-del="${i}">Delete</button></div>`).join('')||'<div class="empty">Add songs to create your local playlist.</div>'}</div></div></div>`}
  function bindMusic(){let audio=window.__srsAudio||new Audio();window.__srsAudio=audio;let idx=Math.max(0,Math.min(Number(state.music.currentIndex||0),Math.max(0,state.music.playlist.length-1)));const load=()=>{const track=state.music.playlist[idx];if(!track)return;if(track.dataUrl)audio.src=track.dataUrl;else if(track.url)audio.src=track.url;if($('#trackName'))$('#trackName').textContent=track.name||'SRS Vision Music Player'};$('#musicFile')?.addEventListener('change',async e=>{const files=[...e.target.files||[]];if(!files.length)return;try{const added=await Promise.all(files.map(f=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({id:Date.now()+Math.random(),name:f.name,dataUrl:r.result});r.onerror=reject;r.readAsDataURL(f)})));state.music.playlist.push(...added);state.music.currentIndex=state.music.playlist.length-added.length;idx=state.music.currentIndex;persist();renderRoute(false);notify('Music saved locally and ready to continue')}catch{notify('Could not save music file')}});$('#musicPlay')?.addEventListener('click',()=>{if(!state.music.playlist[idx])return notify('Add a local music file first');load();audio.paused?audio.play().catch(()=>{}):audio.pause()});$('#musicPrev')?.addEventListener('click',()=>{if(!state.music.playlist.length)return;idx=(idx-1+state.music.playlist.length)%state.music.playlist.length;state.music.currentIndex=idx;persist();load();audio.play().catch(()=>{});renderRoute(false)});$('#musicNext')?.addEventListener('click',()=>{if(!state.music.playlist.length)return;idx=(idx+1)%state.music.playlist.length;state.music.currentIndex=idx;persist();load();audio.play().catch(()=>{});renderRoute(false)});$('#musicRange')?.addEventListener('input',e=>{if(audio.duration)audio.currentTime=audio.duration*Number(e.target.value||0)/100});audio.ontimeupdate=()=>{if($('#musicRange')&&audio.duration)$('#musicRange').value=String(Math.round(audio.currentTime/audio.duration*100))};load()}
  function renderSocial(){const n=state.notifications.filter(x=>!x.read).length;const slots=TOOLS['social-media'][3].map(a=>`<div class="miniTool"><b>${a}</b><small>${state.social?.connected?.[a]?'Connected':'Ready to connect'}</small><div class="heroActions"><button class="btn small primary" data-open-app="${esc(a)}" data-app-key="social-media">Open</button></div></div>`).join('');$('#content').innerHTML=header('Social Media','Platform hub with one place for launches and notifications.','<button class="btn primary" data-nav="notifications">Notifications</button>')+`<section class="workspace"><div class="workspaceCards">${slots}</div><div class="assignBox"><b>Live notification inbox:</b> ${n} unread. External platforms must be connected through their own OAuth/API; this website does not bypass their permissions.</div></section>`}

  function renderMoney(){const tr=state.finance.transfers||[];const latest=tr[0];$('#content').innerHTML=header('Money Transfer','Transparent transfer approval workflow for the SRS Vision team.','<button class="btn primary" data-new-transfer>＋ New Transfer Request</button>')+`<section class="workspace"><div class="assignBox"><b>Rule:</b> every transfer requires ${state.team.members.length}/${state.team.members.length} member approvals; one Deny blocks the request.</div>${latest?`<div class="workCard"><div class="workTitle">${esc(latest.recipient)} · ${money(latest.amount)}</div><div class="projectSub">Requested by ${esc(latest.requester)} · ${esc(latest.purpose||'No purpose')}</div><div class="transferList" style="margin-top:8px">${latest.approvals.map((a,i)=>`<div class="approval"><div><b>${esc(a.name)}</b><div class="projectSub">${a.decision||'Waiting'}</div></div><div class="heroActions"><button class="btn small green" data-approval="${i}" data-decision="Allow">Allow</button><button class="btn small danger" data-approval="${i}" data-decision="Deny">Deny</button></div></div>`).join('')}</div><div class="meta"><span class="chip">Status: ${esc(latest.status)}</span><span class="chip">Allowed: ${latest.approvals.filter(a=>a.decision==='Allow').length}/${state.team.members.length}</span></div>${latest.approvals.every(a=>a.decision==='Allow')?'<div class="pos"><b>✓ All members allowed. Ready for external bank/payment execution.</b></div>':'<div class="neg"><b>Transfer blocked until every member selects Allow.</b></div>'}</div>`:'<div class="empty">No transfer requests yet.</div>'}</section>`}

    },
    pull:async function(){
      try{
        if(!this.db)await this.init();if(!this.db)throw new Error('Firebase unavailable');
        const snap=await this.db.ref('srsVision').once('value');const remote=snap.val();
        if(remote){state=mergeState(remote);saveLocal();renderRoute(false);this.lastRemoteAt=Number(remote.__meta?.updatedAt||Date.now());}
        this.status='online';this.detail='Firebase Cloud sync ON · Realtime ON';renderStatus();return true;
      }catch(e){this.status='error';this.detail=(e?.message||'Firebase read failed')+' · local save remains safe';renderStatus();return false}
    },
    write(force=false){
      const snap=clone(state);
      delete snap.__meta;
      // Keep large local-only audio blobs out of realtime cloud state to prevent unnecessary downloads.
      if(snap.music?.playlist) snap.music.playlist=snap.music.playlist.map(t=>{const x={...t};delete x.dataUrl;return x});
      saveLocal();localStorage.setItem('srsVisionPending','1');
      this.writeChain=this.writeChain.then(async()=>{try{
        if(!this.db)await this.init();if(!this.db)throw new Error('Firebase unavailable');
        const now=Date.now();
        const payload={...snap,__meta:{updatedAt:now}};
        await this.db.ref('srsVision').update(payload);
        localStorage.removeItem('srsVisionPending');this.lastRemoteAt=now;
        this.status='online';this.detail='Saved globally · Firebase Realtime ON';renderStatus();return true;
      }catch(e){
        localStorage.setItem('srsVisionPending','1');this.status='error';this.detail=(e?.message||'Firebase write failed')+' · local save preserved';renderStatus();
        clearTimeout(this.retryTimer);this.retryTimer=setTimeout(()=>this.init(true),3500);return false;
      }});
      return this.writeChain;
    }
  };
  window.SRSVisionLive=Live;
  ensureModal();startGreetingClock();renderShell();renderRoute(false);updateGreeting();setTimeout(()=>Live.init(),250);
})();

</script>
</body>
</html>
